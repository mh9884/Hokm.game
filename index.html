<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 انتخاب بازی</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(180deg, #1a0033 0%, #4a148c 100%);
    color: #fff; margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 2rem; text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .game-btn {
    display: block; width: 280px; padding: 24px;
    margin: 12px; border: none; border-radius: 16px;
    font-family: inherit; font-size: 1.4rem; font-weight: bold;
    cursor: pointer; text-decoration: none; text-align: center;
    color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s;
  }
  .game-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .hokm-btn { background: linear-gradient(180deg, #66bb6a, #2e7d32); }
  .baj-btn { background: linear-gradient(180deg, #ab47bc, #6a1b9a); }
  .subtitle {
    font-size: 0.85rem; opacity: 0.75;
    margin: -6px 0 8px; text-align: center;
  }
</style>
</head>
<body>
  <h1>🎮 انتخاب بازی</h1>
  <a href="hokm.html" class="game-btn hokm-btn">🃏 حکم</a>
  <p class="subtitle">۲، ۳ یا ۴ نفره — تیمی و انفرادی</p>
  <a href="baj.html" class="game-btn baj-btn">🎴 باج</a>
  <p class="subtitle">۳ نفره — بدون اینترنت هم کار می‌کنه</p>
</body>
</html>
